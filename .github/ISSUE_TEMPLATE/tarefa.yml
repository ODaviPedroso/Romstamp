name: Tarefa
description: Funcionalidade ou trabalho técnico com resultado verificável
body:
  - type: textarea
    id: objetivo
    attributes:
      label: Objetivo
      description: Qual problema vamos resolver e para quem?
    validations:
      required: true
  - type: textarea
    id: escopo
    attributes:
      label: Escopo
      description: Entregas e limites desta tarefa.
    validations:
      required: true
  - type: textarea
    id: aceite
    attributes:
      label: Critérios de aceite
      description: Comportamentos observáveis que permitem concluir a tarefa.
      placeholder: '- [ ] ...'
    validations:
      required: true
  - type: textarea
    id: dependencias
    attributes:
      label: Dependências e referência na especificação
